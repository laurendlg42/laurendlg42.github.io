    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">MECHANICS OF POWER</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="physics.html">Physics of Throwing</a></li>
                    <li class="nav-item"><a class="nav-link" href="robotics.html">Robotics</a></li>

                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center">Connect with Our Engineers</h2>
                <p class="text-center">Have questions about the physics of throwing? Reach out below.</p>
                
                <form class="p-4 border rounded shadow-sm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Inquiry Type</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="inquiry" id="physics" checked>
                            <label class="form-check-label" for="physics">Physics/Biomechanics</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="inquiry" id="robotics">
                            <label class="form-check-label" for="robotics">Robotics/Hardware</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Send Message</button>
                </form>
            </div>
        </div>
    </div>
    
    <footer class="bg-dark text-white text-center py-3">
        <p>© 2026 @ MECHANICS OF POWER. All Rights Reserved.</p>
    </footer>
